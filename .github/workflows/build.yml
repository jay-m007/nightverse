name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test LRC parser
        run: node scripts/test-lrc.mjs

      - name: Build browser extension
        run: node scripts/build-extension.mjs --zip

      - name: Build portable app (zip)
        shell: pwsh
        run: |
          dotnet publish apps/desktop/Nightverse.Desktop.csproj -c Release -r win-x64 --self-contained true -o out/portable
          Compress-Archive -Path out/portable/* -DestinationPath out/Nightverse-portable-win-x64.zip

      - name: Build MSIX (unsigned, for Store upload)
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { ($env:GITHUB_REF_NAME.TrimStart('v')) + '.0' } else { '1.0.0.0' }
          ./packaging/build-msix.ps1 -Version $v -Arch x64 `
            -IdentityName "${{ vars.STORE_IDENTITY_NAME || 'JayMaurya.Nightverse' }}" `
            -Publisher "${{ vars.STORE_PUBLISHER || 'CN=8F753F8D-5097-4DF2-922A-CB81A51BF517' }}" `
            -PublisherDisplayName "${{ vars.STORE_PUBLISHER_DISPLAY_NAME || 'Jay Maurya' }}"

      - name: Publish Store package to the store-package branch
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $msix = Get-ChildItem out/*.msix | Select-Object -First 1
          Write-Host "MSIX size: $([math]::Round($msix.Length / 1MB, 1)) MB"
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item $msix.FullName pkg/Nightverse.msix
          Copy-Item out/nightverse-extension.zip pkg/
          Set-Location pkg
          git init -q -b store-package
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Store package from $env:GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" store-package

      - uses: actions/upload-artifact@v4
        with:
          name: nightverse-builds
          path: |
            out/*.msix
            out/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.msix
            out/*.zip
          generate_release_notes: true
